<div class="rounded-xl border border-secondary-100 p-6">
    <h1 class="header header-3">Summary</h1>

    <ul class="mt-4 flex flex-col gap-4">
        <li class="flex justify-between">
            <span class="font-medium">Base price</span>
            <span class="font-semibold">{{ product()?.price | currency }}</span>
        </li>
        <li class="flex justify-between">
            <span class="font-medium">Discount</span>
            <span class="font-semibold">{{ discount() | currency }}</span>
        </li>
        <li class="flex justify-between">
            <span class="font-medium">VAT</span>
            <span class="font-semibold">{{ vat() | currency }}</span>
        </li>
    </ul>

    <div class="my-4 border-b border-b-secondary-100"></div>

    <div class="flex items-center justify-between">
        <span class="text-xl font-medium">Total:</span>
        <span class="text-xl font-bold">{{ total() | currency }}</span>
    </div>

    <div>
        <app-button routerLink="/page-list/booking" className="mt-6 w-full rounded-xl" severity="primary">
            Proceed to Payment
        </app-button>
    </div>
</div>
