<app-slider src="assets/images/home/home-slide.png" bottomClassName="bg-white">
    <div class="text-center text-white">
        <h2 class="text-6xl leading-24 font-semibold">Profile</h2>
    </div>
</app-slider>

<div class="content grid grid-cols-12 gap-10 px-4 md:px-10">
    <div class="col-span-3 rounded-xl bg-secondary-200 p-4">
        <div class="border-b border-b-gray-200 pb-4">
            <h3 class="header header-4 btn-trigger text-warning">Information</h3>
        </div>
        <div class="mt-4 border-b border-b-gray-200 pb-4">
            <h3 class="header header-4 btn-trigger">History Book</h3>
        </div>
        <div class="mt-4 border-b border-b-gray-200 pb-4">
            <h3 class="header header-4 btn-trigger">Change Password</h3>
        </div>
        <div class="mt-4 border-b border-b-gray-200 pb-4">
            <h3 class="header header-4 btn-trigger">Settings</h3>
        </div>
    </div>

    <div class="col-span-9">
        <h2 class="header header-2">User Information</h2>

        <div class="mt-10 grid grid-cols-12">
            <div class="col-span-9">
                <div class="mt-4 flex items-center gap-4">
                    <span>Username:</span>
                    <span class="text-base font-semibold">{{ user()?.username }}</span>
                </div>
                <div class="mt-4 flex items-center gap-4">
                    <span>Name:</span>
                    <span class="text-base font-semibold">{{ user()?.name }}</span>
                </div>
                <div class="mt-4 flex items-center gap-4">
                    <span>Email:</span>
                    <span class="text-base font-semibold">{{ user()?.email }}</span>
                </div>
                <div class="mt-4 flex items-center gap-4">
                    <span>Phone:</span>
                    <span class="text-base font-semibold">{{ user()?.phone }}</span>
                </div>
            </div>
            <div class="col-span-3 flex items-center justify-center overflow-hidden rounded-full">
                <img class="w-full" [ngSrc]="user()?.avatar ?? ''" alt="" fill />
            </div>
        </div>
    </div>
</div>
