<div class="flex items-center gap-8">
    <img class="max-w-25 rounded-xl" [src]="imageUrl()" alt="Image 1" />
    <div class="flex flex-col gap-2">
        <a routerLink="/page-list/detail/{{ title() }}">
            <span>
                {{ title() }}
            </span>
        </a>
        <span class="mt-2 flex gap-2">
            <span><icon-eye /></span>
            <span>{{ count() | number }}</span>
        </span>
    </div>
</div>
